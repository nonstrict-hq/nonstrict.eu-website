{{- $res := .Page.Resources.Get .Destination -}}
{{- if not $res -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .Text }}">
{{- else -}}
<figure class="not-prose relative my-10">
    {{- if eq $res.MediaType.MainType "video" -}}
    {{- $base := strings.TrimSuffix (path.Ext .Destination) .Destination -}}
    {{- $poster := or (.Page.Resources.Get (printf "%s.png" $base)) (.Page.Resources.Get (printf "%s.jpg" $base)) -}}
    <video src="{{ $res.RelPermalink }}" {{ with $poster }}poster="{{ .RelPermalink }}"{{ end }} autoplay muted loop playsinline controls class="w-full rounded-xl ring-1 ring-gray-900/5 dark:ring-white/10"></video>
    {{- else -}}
    {{- $srcset := slice -}}
    {{- $src := $res -}}
    {{- range slice 672 1008 1344 1680 -}}
    {{- if lt . $res.Width -}}
    {{- $img := $res.Resize (printf "%dx webp q90 Lanczos picture" .) -}}
    {{- $srcset = $srcset | append (printf "%s %dw" $img.RelPermalink .) -}}
    {{- if eq . 1344 }}{{ $src = $img }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $srcset = $srcset | append (printf "%s %dw" $res.RelPermalink $res.Width) -}}
    <a href="{{ $res.RelPermalink }}"><img src="{{ $src.RelPermalink }}" srcset="{{ delimit $srcset ", " }}" sizes="(min-width: 1024px) 42rem, calc(100vw - 3rem)" width="{{ $res.Width }}" height="{{ $res.Height }}" alt="{{ .Text }}" loading="lazy" class="w-full rounded-xl ring-1 ring-gray-900/5 dark:ring-white/10"></a>
    {{- end -}}
    {{- if and hugo.IsServer (in (.Page.Params.placeholders | default slice) .Destination) }}<span class="absolute left-3 top-3 rounded-full bg-amber-400 px-2.5 py-0.5 text-xs font-semibold text-amber-950">Placeholder</span>{{ end -}}
    {{- with .Text }}<figcaption class="mt-3 text-center text-sm text-gray-500 dark:text-gray-400">{{ . }}</figcaption>{{ end -}}
</figure>
{{- end -}}
