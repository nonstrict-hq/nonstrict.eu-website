[vision_faq1_q]
other = "¿Dónde consigo Bezel para visionOS? ¿Cuál es el precio?"

[vision_faq1_a]
other = "Bezel está disponible en la <a class=\"underline\" href=\"https://apps.apple.com/us/app/bezel-device-mirror/id6476657945\">App Store</a> como compra única de $5. También necesitas la app Bezel para iOS (versión gratuita) en el iPhone que quieras duplicar."

[vision_faq2_q]
other = "¿Qué dispositivos se pueden duplicar hacia Bezel para visionOS?"

[vision_faq2_a]
other = "En el lanzamiento son compatibles los iPhone con FaceID que ejecuten iOS 16.4 o posterior. Queremos dar soporte a más dispositivos Apple en el futuro."

[vision_faq3_q]
other = "¿Qué relación tiene Bezel para visionOS con Bezel para macOS?"

[vision_faq3_a]
other = "Bezel para visionOS es una app nativa para Apple Vision Pro creada desde cero y vendida como compra independiente. Puedes conseguir <a class=\"underline\" href=\"/bezel/\">Bezel para Mac</a> en el <a class=\"underline\" href=\"/bezel/\">sitio web</a>."

