#
# ─── Preguntas frecuentes de precios (pricing.html). Las respuestas con enlaces se renderizan con safeHTML. ───
#
[faq_title]
other = "Preguntas frecuentes"

[faq_multi_q]
other = "¿Puedo instalar Bezel en varios Mac?"

[faq_multi_a]
other = "¡Sí! Cada licencia personal es válida para 1 usuario, pero se puede instalar en hasta 3 Mac. Esto es perfecto si tienes un ordenador de sobremesa y un portátil, o usas distintas máquinas en el trabajo y en casa."

[faq_sub_vs_lifetime_q]
other = "¿Cuál es la diferencia entre la suscripción y la licencia de por vida?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Con una <strong>suscripción</strong> (mensual o anual), obtienes acceso completo a todas las funciones de Bezel Pro mientras tu suscripción esté activa. Si la cancelas, podrás seguir usando la versión de prueba gratuita.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">La licencia <strong>de por vida</strong> es una compra única que te da acceso permanente a todas las funciones Pro durante toda la vida de la app, incluidas todas las futuras actualizaciones.</p>"

[faq_cancel_q]
other = "¿Qué pasa si cancelo mi suscripción?"

[faq_cancel_a]
other = "Si cancelas tu suscripción, conservarás el acceso a las funciones Pro hasta el final de tu periodo de facturación. Después, Bezel volverá a la versión de prueba gratuita, que incluye una marca de agua y límites de tiempo."

[faq_guarantee_q]
other = "¿En qué consiste la garantía de devolución de 30 días?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">¡Te permite comprar sin riesgo! Solo dinos en un plazo de 30 días desde la compra por qué no estás satisfecho y te devolveremos el dinero, sea cual sea el motivo.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Contáctanos en <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "¿Puedo obtener una factura de mi compra?"

[faq_invoice_a]
other = "Tras una compra correcta, recibirás un correo de Paddle con la factura adjunta. Si necesitas los datos de tu empresa o el número de IVA en la factura, añade la información de IVA en el segundo paso del proceso de pago mediante el enlace \"Add VAT\" en la parte inferior izquierda."

[faq_manage_q]
other = "¿Cómo gestiono mi suscripción?"

[faq_manage_a]
other = "Puedes gestionar tu suscripción, actualizar los métodos de pago o cancelar en cualquier momento a través del <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">portal de clientes de Paddle</a>. También puedes acceder a él desde Bezel en Ajustes > Acerca de."

[faq_license_q]
other = "¿Dónde encuentro mi licencia?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Tras una compra correcta, recibirás un correo nuestro con tu clave de licencia. Asegúrate de revisar la carpeta de spam.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Si no encuentras tu clave de licencia, ponte en contacto con nosotros en <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "¿Hay algún descuento por actualización?"

[faq_upgrade_a]
other = "Si compraste Bezel con una licencia de un año de actualizaciones, tienes derecho a un 50% de descuento en los nuevos planes de Bezel. Introduce tu número de serie anterior abajo para obtener tu descuento de actualización."

[upgrade_banner_title]
other = "¿Vienes de una versión anterior de Bezel?"

[upgrade_banner_sub]
other = "Introduce tu número de serie anterior para un 50% de descuento."

[upgrade_enter_serial]
other = "Introduce el número de serie"

[upgrade_get_discount]
other = "Obtener descuento"

[upgrade_to_yearly]
other = "Cambiar al plan anual"

[upgrade_to_lifetime]
other = "Cambiar a licencia de por vida"

[faq_transfer_q]
other = "¿Cómo transfiero mi licencia a otro Mac?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Desactiva el Mac que está usando actualmente tu licencia yendo a Ajustes > Acerca de y haz clic en el botón \"Deactivate License..\". Tras desactivarla, podrás usar la clave de licencia en otro Mac.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Si has perdido el acceso a la máquina que usa tu licencia, contáctanos en <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

