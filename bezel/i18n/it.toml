#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "Domande frequenti"

[faq_multi_q]
other = "Posso installare Bezel su più Mac?"

[faq_multi_a]
other = "Sì! Ogni licenza personale è valida per 1 utente ma può essere installata su un massimo di 3 Mac. È perfetta se hai un desktop e un portatile, o usi macchine diverse al lavoro e a casa."

[faq_sub_vs_lifetime_q]
other = "Qual è la differenza tra abbonamento e licenza a vita?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Con un <strong>abbonamento</strong> (mensile o annuale), ottieni l'accesso completo a tutte le funzionalità di Bezel Pro finché l'abbonamento è attivo. Se annulli, potrai comunque usare la versione di prova gratuita.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">La licenza <strong>a vita</strong> è un acquisto una tantum che ti dà accesso permanente a tutte le funzionalità Pro per tutta la durata dell'app, inclusi tutti gli aggiornamenti futuri.</p>"

[faq_cancel_q]
other = "Cosa succede se annullo l'abbonamento?"

[faq_cancel_a]
other = "Se annulli l'abbonamento, manterrai l'accesso alle funzionalità Pro fino alla fine del periodo di fatturazione. Dopodiché, Bezel tornerà alla versione di prova gratuita, che include una filigrana e limiti di tempo."

[faq_guarantee_q]
other = "Cos'è la Garanzia di rimborso di 30 giorni?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Ti permette di acquistare senza rischi! Comunicaci entro 30 giorni dall'acquisto perché non sei soddisfatto e ti rimborseremo, qualunque sia il motivo.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Contattaci a <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "Posso ottenere una fattura per il mio acquisto?"

[faq_invoice_a]
other = "Dopo l'acquisto andato a buon fine, ricevi un'email da Paddle con la fattura allegata. Se ti servono i dati della tua azienda e/o il numero di partita IVA sulla fattura, aggiungi le informazioni IVA nel secondo passaggio durante il checkout usando il link \"Add VAT\" in basso a sinistra."

[faq_manage_q]
other = "Come gestisco il mio abbonamento?"

[faq_manage_a]
other = "Puoi gestire l'abbonamento, aggiornare i metodi di pagamento o annullare in qualsiasi momento tramite il <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">portale clienti Paddle</a>. Puoi accedervi anche da Bezel tramite Impostazioni > Info."

[faq_license_q]
other = "Dove trovo la mia licenza?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Dopo un acquisto andato a buon fine, ricevi un'email da noi con la tua chiave di licenza. Assicurati di controllare la cartella Spam.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Se non riesci a trovare la chiave di licenza, contattaci a <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "È disponibile uno sconto per l'aggiornamento?"

[faq_upgrade_a]
other = "Se hai acquistato Bezel con una licenza con un anno di aggiornamenti, hai diritto a uno sconto del 50% sui nuovi piani Bezel. Inserisci il tuo numero di serie precedente qui sotto per ottenere lo sconto sull'aggiornamento."

[upgrade_banner_title]
other = "Stai effettuando l'aggiornamento da una versione precedente di Bezel?"

[upgrade_banner_sub]
other = "Inserisci il tuo numero di serie precedente per uno sconto del 50%."

[upgrade_enter_serial]
other = "Inserisci il numero di serie"

[upgrade_get_discount]
other = "Ottieni lo sconto"

[upgrade_to_yearly]
other = "Passa all'annuale"

[upgrade_to_lifetime]
other = "Passa alla licenza a vita"

[faq_transfer_q]
other = "Come trasferisco la licenza su un altro Mac?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Disattiva il Mac che sta attualmente usando la tua licenza andando in Impostazioni > Info e clicca il pulsante \"Disattiva licenza..\". Dopo la disattivazione puoi usare la chiave di licenza su un altro Mac.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Se hai perso l'accesso alla macchina che usa la tua licenza, contattaci a <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

