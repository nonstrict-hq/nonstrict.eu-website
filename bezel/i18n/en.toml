[helper_title]
other = "Bezel Helper"

[helper_intro]
other = "For Bezel to <strong>identify the model, color, and connection status of the iPhone</strong> or iPad connected to your Mac, you need to install a small helper application."

[helper_step1]
other = "Download the Bezel Helper app:"

[helper_download_btn]
other = "Download Helper"

[helper_step2]
other = "When the download is complete, launch Bezel Helper by double-clicking it."

[helper_step3]
other = "The Helper automatically connect to Bezel and will identify the model, color, and connection status of your iPhone."

[helper_why_title]
other = "Why is this necessary?"

[helper_why_text]
other = "Sandboxing in macOS prevents Bezel from talking to the iPhone directly, so when you connect an iPhone or iPad, Bezel uses the helper app (which lives outside the sandbox) as an intermediary."

