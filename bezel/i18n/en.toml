#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "Frequently Asked Questions"

[faq_multi_q]
other = "Can I install Bezel on multiple Macs?"

[faq_multi_a]
other = "Yes! Each personal license is valid for 1 user but can be installed on up to 3 Macs. This is perfect if you have a desktop and a laptop, or use different machines at work and home."

[faq_sub_vs_lifetime_q]
other = "What's the difference between subscription and lifetime?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">With a <strong>subscription</strong> (monthly or yearly), you get full access to all Bezel Pro features as long as your subscription is active. If you cancel, you'll still be able to use the free trial version.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">The <strong>lifetime</strong> license is a one-time purchase that gives you permanent access to all Pro features for the lifetime of the app, including all future updates.</p>"

[faq_cancel_q]
other = "What happens if I cancel my subscription?"

[faq_cancel_a]
other = "If you cancel your subscription, you'll retain access to Pro features until the end of your billing period. After that, Bezel will revert to the free trial version, which includes a watermark and time limits."

[faq_guarantee_q]
other = "What's the 30-Day Money-Back Guarantee?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">It gives you risk free purchasing! Just let us know within 30 days of purchase why you're unhappy, and we'll refund whatever the reason is.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Contact us at <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "Can I get an invoice for my purchase?"

[faq_invoice_a]
other = "After successful purchase, you get an email from Paddle with the invoice attached. If you need your business details and/or VAT number on the invoice, add VAT information in the second step during checkout using the \"Add VAT\" link on the bottom left."

[faq_manage_q]
other = "How do I manage my subscription?"

[faq_manage_a]
other = "You can manage your subscription, update payment methods, or cancel anytime through the <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">Paddle customer portal</a>. You can also access this from within Bezel via Settings > About."

[faq_license_q]
other = "Where can I find my license?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">After a successful purchase, you get an email from us with your license key. Make sure to check your Spam folder.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">If you can't find your license key please reach out to us at <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "Is there an upgrade discount available?"

[faq_upgrade_a]
other = "If you purchased Bezel with a one year of upgrades license, you're eligible for a 50% discount on the new Bezel plans. Enter your previous serial below to get your upgrade discount."

[upgrade_banner_title]
other = "Upgrading from an earlier Bezel version?"

[upgrade_banner_sub]
other = "Enter your previous serial for a 50% discount."

[upgrade_enter_serial]
other = "Enter serial"

[upgrade_get_discount]
other = "Get Discount"

[upgrade_to_yearly]
other = "Upgrade to yearly"

[upgrade_to_lifetime]
other = "Upgrade to lifetime"

[faq_transfer_q]
other = "How do I transfer my license to another Mac?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Deactivate the Mac currently using your license by going to Settings > About and click the \"Deactivate License..\" button. After deactivating you can use the license key on another Mac.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">If you've lost access to the machine using your license, please contact us at <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

