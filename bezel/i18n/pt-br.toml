[helper_step3]
other = "O Helper se conecta automaticamente ao Bezel e identificará o modelo, a cor e o status de conexão do seu iPhone."

[helper_why_title]
other = "Por que isso é necessário?"

[helper_why_text]
other = "O sandboxing no macOS impede que o Bezel se comunique diretamente com o iPhone, então, quando você conecta um iPhone ou iPad, o Bezel usa o app auxiliar (que fica fora do sandbox) como intermediário."

