[vision_faq1_q]
other = "Onde consigo o Bezel para visionOS? Qual é o preço?"

[vision_faq1_a]
other = "O Bezel está disponível na <a class=\"underline\" href=\"https://apps.apple.com/us/app/bezel-device-mirror/id6476657945\">App Store</a> como uma compra única de $5. O app Bezel para iOS (versão gratuita) também é necessário no iPhone que você quer espelhar."

[vision_faq2_q]
other = "Quais dispositivos podem ser espelhados para o Bezel para visionOS?"

[vision_faq2_a]
other = "No lançamento, são compatíveis iPhones com FaceID rodando o iOS 16.4 ou mais recente. Pretendemos oferecer suporte a mais dispositivos da Apple no futuro."

[vision_faq3_q]
other = "Como o Bezel para visionOS se relaciona com o Bezel para macOS?"

[vision_faq3_a]
other = "O Bezel para visionOS é um app nativo para o Apple Vision Pro criado do zero e vendido como uma compra separada. Você pode obter o <a class=\"underline\" href=\"/bezel/\">Bezel para Mac</a> no <a class=\"underline\" href=\"/bezel/\">site</a>."

