[helper_title]
other = "Bezel Helper"

[helper_intro]
other = "Para que o Bezel possa <strong>identificar o modelo, a cor e o status de conexão do iPhone</strong> ou iPad conectado ao seu Mac, você precisa instalar um pequeno aplicativo auxiliar."

[helper_step1]
other = "Baixe o app Bezel Helper:"

[helper_download_btn]
other = "Baixar o Helper"

[helper_step2]
