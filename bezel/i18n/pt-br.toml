#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "Perguntas frequentes"

[faq_multi_q]
other = "Posso instalar o Bezel em vários Macs?"

[faq_multi_a]
other = "Sim! Cada licença pessoal é válida para 1 usuário, mas pode ser instalada em até 3 Macs. Isso é perfeito se você tem um desktop e um laptop, ou usa máquinas diferentes no trabalho e em casa."

[faq_sub_vs_lifetime_q]
other = "Qual é a diferença entre assinatura e vitalício?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Com uma <strong>assinatura</strong> (mensal ou anual), você tem acesso total a todos os recursos do Bezel Pro enquanto sua assinatura estiver ativa. Se você cancelar, ainda poderá usar a versão de teste gratuita.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">A licença <strong>vitalícia</strong> é uma compra única que lhe dá acesso permanente a todos os recursos Pro durante toda a vida útil do app, incluindo todas as atualizações futuras.</p>"

[faq_cancel_q]
other = "O que acontece se eu cancelar minha assinatura?"

[faq_cancel_a]
other = "Se você cancelar sua assinatura, manterá o acesso aos recursos Pro até o fim do seu período de cobrança. Depois disso, o Bezel voltará à versão de teste gratuita, que inclui uma marca d'água e limites de tempo."

[faq_guarantee_q]
other = "O que é a Garantia de reembolso de 30 dias?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Ela permite uma compra sem riscos! Basta nos informar, dentro de 30 dias após a compra, por que você está insatisfeito, e reembolsaremos seja qual for o motivo.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Fale conosco em <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "Posso obter uma nota fiscal da minha compra?"

[faq_invoice_a]
other = "Após a compra bem-sucedida, você recebe um e-mail da Paddle com a nota fiscal anexada. Se precisar dos dados da sua empresa e/ou do número de IVA na nota fiscal, adicione as informações de IVA na segunda etapa durante o checkout usando o link \"Add VAT\" no canto inferior esquerdo."

[faq_manage_q]
other = "Como faço para gerenciar minha assinatura?"

[faq_manage_a]
other = "Você pode gerenciar sua assinatura, atualizar formas de pagamento ou cancelar a qualquer momento pelo <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">portal do cliente da Paddle</a>. Você também pode acessá-lo de dentro do Bezel em Ajustes > Sobre."

[faq_license_q]
other = "Onde posso encontrar minha licença?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Após uma compra bem-sucedida, você recebe um e-mail nosso com sua chave de licença. Não deixe de verificar sua pasta de Spam.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Se você não conseguir encontrar sua chave de licença, entre em contato conosco em <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "Há um desconto de atualização disponível?"

[faq_upgrade_a]
other = "Se você comprou o Bezel com uma licença de um ano de atualizações, tem direito a 50% de desconto nos novos planos do Bezel. Digite seu serial anterior abaixo para obter seu desconto de atualização."

[upgrade_banner_title]
other = "Atualizando de uma versão anterior do Bezel?"

[upgrade_banner_sub]
other = "Digite seu serial anterior para 50% de desconto."

[upgrade_enter_serial]
other = "Digite o serial"

[upgrade_get_discount]
other = "Obter desconto"

[upgrade_to_yearly]
other = "Atualizar para o anual"

[upgrade_to_lifetime]
other = "Atualizar para o vitalício"

[faq_transfer_q]
other = "Como faço para transferir minha licença para outro Mac?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Desative o Mac que está usando sua licença atualmente acessando Ajustes > Sobre e clicando no botão \"Desativar licença..\". Após desativar, você pode usar a chave de licença em outro Mac.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Se você perdeu o acesso à máquina que está usando sua licença, entre em contato conosco em <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

