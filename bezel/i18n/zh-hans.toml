#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "常见问题"

[faq_multi_q]
other = "我可以在多台 Mac 上安装 Bezel 吗？"

[faq_multi_a]
other = "可以！每个个人许可证供 1 位用户使用，但可安装在至多 3 台 Mac 上。如果你既有台式机又有笔记本，或在公司和家里使用不同的机器，这非常合适。"

[faq_sub_vs_lifetime_q]
other = "订阅和永久版有什么区别？"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">使用<strong>订阅</strong>（月付或年付）时，只要订阅处于有效状态，你就能完整使用全部 Bezel Pro 功能。如果取消订阅，你仍可使用免费试用版。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\"><strong>永久</strong>许可证是一次性购买，让你在应用的整个生命周期内永久使用全部 Pro 功能，包括所有未来更新。</p>"

[faq_cancel_q]
other = "如果我取消订阅会怎样？"

[faq_cancel_a]
other = "如果你取消订阅，在当前计费周期结束前仍可使用 Pro 功能。之后，Bezel 将恢复为免费试用版，其中包含水印和时间限制。"

[faq_guarantee_q]
other = "30 天退款保证是什么？"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">它让你的购买毫无风险！只需在购买后 30 天内告诉我们你为何不满意，无论原因如何，我们都会退款。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">请通过 <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a> 联系我们</p>"

[faq_invoice_q]
other = "我可以获取购买发票吗？"

[faq_invoice_a]
other = "成功购买后，你会收到 Paddle 发来的邮件，并附上发票。如果你需要在发票上填写公司信息和/或增值税号，请在结账的第二步中，使用左下角的“Add VAT”链接添加增值税信息。"

[faq_manage_q]
other = "我该如何管理我的订阅？"

[faq_manage_a]
other = "你可以随时通过 <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">Paddle 客户门户</a> 管理订阅、更新付款方式或取消订阅。你也可以在 Bezel 中通过“设置 > 关于”进入。"

[faq_license_q]
other = "我在哪里可以找到我的许可证？"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">成功购买后，你会收到我们发来的邮件，其中包含你的许可证密钥。请务必检查垃圾邮件文件夹。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">如果你找不到许可证密钥，请通过 <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a> 联系我们。</p>"

[faq_upgrade_q]
other = "有升级折扣吗？"

[faq_upgrade_a]
other = "如果你购买的是含一年更新的 Bezel 许可证，便有资格在新的 Bezel 方案上享受 50% 折扣。请在下方输入你之前的序列号以获取升级折扣。"

[upgrade_banner_title]
other = "从早期 Bezel 版本升级？"

[upgrade_banner_sub]
other = "输入你之前的序列号以享受 50% 折扣。"

[upgrade_enter_serial]
other = "输入序列号"

[upgrade_get_discount]
other = "获取折扣"

[upgrade_to_yearly]
other = "升级到年付"

[upgrade_to_lifetime]
other = "升级到永久版"

[faq_transfer_q]
other = "我该如何把许可证转移到另一台 Mac？"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">前往“设置 > 关于”，点击“Deactivate License..”按钮，停用当前正在使用许可证的 Mac。停用后，你便可在另一台 Mac 上使用该许可证密钥。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">如果你已无法访问正在使用许可证的机器，请通过 <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a> 联系我们。</p>"

