#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "Häufig gestellte Fragen"

[faq_multi_q]
other = "Kann ich Bezel auf mehreren Macs installieren?"

[faq_multi_a]
other = "Ja! Jede persönliche Lizenz ist für 1 Nutzer gültig, kann aber auf bis zu 3 Macs installiert werden. Das ist perfekt, wenn du einen Desktop und einen Laptop hast oder verschiedene Rechner bei der Arbeit und zu Hause nutzt."

[faq_sub_vs_lifetime_q]
other = "Was ist der Unterschied zwischen Abo und Lebenslang?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Mit einem <strong>Abo</strong> (monatlich oder jährlich) erhältst du vollen Zugriff auf alle Bezel Pro-Funktionen, solange dein Abo aktiv ist. Wenn du kündigst, kannst du weiterhin die kostenlose Testversion nutzen.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Die <strong>Lebenslang</strong>-Lizenz ist ein einmaliger Kauf, der dir dauerhaften Zugriff auf alle Pro-Funktionen für die Lebensdauer der App gibt, einschließlich aller zukünftigen Updates.</p>"

[faq_cancel_q]
other = "Was passiert, wenn ich mein Abo kündige?"

[faq_cancel_a]
other = "Wenn du dein Abo kündigst, behältst du den Zugriff auf die Pro-Funktionen bis zum Ende deines Abrechnungszeitraums. Danach kehrt Bezel zur kostenlosen Testversion zurück, die ein Wasserzeichen und Zeitlimits enthält."

[faq_guarantee_q]
other = "Was ist die 30-Tage-Geld-zurück-Garantie?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Sie ermöglicht dir risikofreies Einkaufen! Sag uns einfach innerhalb von 30 Tagen nach dem Kauf, warum du unzufrieden bist, und wir erstatten dir den Betrag – ganz gleich aus welchem Grund.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Kontaktiere uns unter <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "Kann ich eine Rechnung für meinen Kauf erhalten?"

[faq_invoice_a]
other = "Nach erfolgreichem Kauf erhältst du eine E-Mail von Paddle mit der angehängten Rechnung. Wenn du deine Geschäftsdaten und/oder USt-IdNr. auf der Rechnung benötigst, füge die USt-Informationen im zweiten Schritt während des Bezahlvorgangs über den Link „Add VAT“ unten links hinzu."

[faq_manage_q]
other = "Wie verwalte ich mein Abo?"

[faq_manage_a]
other = "Du kannst dein Abo jederzeit verwalten, Zahlungsmethoden aktualisieren oder kündigen – über das <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">Paddle-Kundenportal</a>. Du kannst dies auch direkt in Bezel über Einstellungen > Über aufrufen."

[faq_license_q]
other = "Wo finde ich meine Lizenz?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Nach einem erfolgreichen Kauf erhältst du eine E-Mail von uns mit deinem Lizenzschlüssel. Schau auch in deinem Spam-Ordner nach.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Wenn du deinen Lizenzschlüssel nicht finden kannst, wende dich bitte an uns unter <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "Gibt es einen Upgrade-Rabatt?"

[faq_upgrade_a]
other = "Wenn du Bezel mit einer Lizenz mit einem Jahr Updates gekauft hast, hast du Anspruch auf 50 % Rabatt auf die neuen Bezel-Tarife. Gib unten deine vorherige Seriennummer ein, um deinen Upgrade-Rabatt zu erhalten."

[upgrade_banner_title]
other = "Upgrade von einer früheren Bezel-Version?"

[upgrade_banner_sub]
other = "Gib deine vorherige Seriennummer für 50 % Rabatt ein."

[upgrade_enter_serial]
other = "Seriennummer eingeben"

[upgrade_get_discount]
other = "Rabatt erhalten"

[upgrade_to_yearly]
other = "Auf jährlich upgraden"

[upgrade_to_lifetime]
other = "Auf lebenslang upgraden"

[faq_transfer_q]
other = "Wie übertrage ich meine Lizenz auf einen anderen Mac?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Deaktiviere den Mac, der derzeit deine Lizenz nutzt, indem du zu Einstellungen > Über gehst und auf die Schaltfläche „Lizenz deaktivieren..“ klickst. Nach der Deaktivierung kannst du den Lizenzschlüssel auf einem anderen Mac verwenden.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Wenn du keinen Zugriff mehr auf den Rechner hast, der deine Lizenz nutzt, kontaktiere uns bitte unter <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

