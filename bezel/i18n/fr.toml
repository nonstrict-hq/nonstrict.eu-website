#
# ─── Pricing FAQ ───
#
[faq_title]
other = "Foire aux questions"

[faq_multi_q]
other = "Puis-je installer Bezel sur plusieurs Mac ?"

[faq_multi_a]
other = "Oui ! Chaque licence personnelle est valable pour 1 utilisateur mais peut être installée sur 3 Mac maximum. C'est parfait si vous avez un ordinateur de bureau et un portable, ou si vous utilisez des machines différentes au travail et à la maison."

[faq_sub_vs_lifetime_q]
other = "Quelle est la différence entre l'abonnement et la licence à vie ?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Avec un <strong>abonnement</strong> (mensuel ou annuel), vous bénéficiez d'un accès complet à toutes les fonctionnalités de Bezel Pro tant que votre abonnement est actif. Si vous résiliez, vous pourrez toujours utiliser la version d'essai gratuite.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">La licence <strong>à vie</strong> est un achat unique qui vous donne un accès permanent à toutes les fonctionnalités Pro pendant toute la durée de vie de l'app, y compris toutes les futures mises à jour.</p>"

[faq_cancel_q]
other = "Que se passe-t-il si je résilie mon abonnement ?"

[faq_cancel_a]
other = "Si vous résiliez votre abonnement, vous conservez l'accès aux fonctionnalités Pro jusqu'à la fin de votre période de facturation. Après cela, Bezel reviendra à la version d'essai gratuite, qui inclut un filigrane et des limites de temps."

[faq_guarantee_q]
other = "Qu'est-ce que la garantie de remboursement de 30 jours ?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Elle vous permet d'acheter sans risque ! Dites-nous simplement, dans les 30 jours suivant l'achat, pourquoi vous n'êtes pas satisfait, et nous vous rembourserons quelle qu'en soit la raison.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Contactez-nous à <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "Puis-je obtenir une facture pour mon achat ?"

[faq_invoice_a]
other = "Après un achat réussi, vous recevez un e-mail de Paddle avec la facture jointe. Si vous avez besoin de vos coordonnées professionnelles et/ou de votre numéro de TVA sur la facture, ajoutez les informations de TVA lors de la deuxième étape du paiement à l'aide du lien « Add VAT » en bas à gauche."

[faq_manage_q]
other = "Comment gérer mon abonnement ?"

[faq_manage_a]
other = "Vous pouvez gérer votre abonnement, mettre à jour vos moyens de paiement ou résilier à tout moment via le <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">portail client Paddle</a>. Vous pouvez également y accéder depuis Bezel via Réglages > À propos."

[faq_license_q]
other = "Où puis-je trouver ma licence ?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Après un achat réussi, vous recevez de notre part un e-mail contenant votre clé de licence. Pensez à vérifier votre dossier Spam.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Si vous ne trouvez pas votre clé de licence, contactez-nous à <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "Une remise de mise à niveau est-elle disponible ?"

[faq_upgrade_a]
other = "Si vous avez acheté Bezel avec une licence incluant un an de mises à jour, vous avez droit à une remise de 50 % sur les nouveaux forfaits Bezel. Saisissez votre ancien numéro de série ci-dessous pour obtenir votre remise de mise à niveau."

[upgrade_banner_title]
other = "Vous passez d'une version antérieure de Bezel ?"

[upgrade_banner_sub]
other = "Saisissez votre ancien numéro de série pour une remise de 50 %."

[upgrade_enter_serial]
other = "Saisir le numéro de série"

[upgrade_get_discount]
other = "Obtenir la remise"

[upgrade_to_yearly]
other = "Passer à l'annuel"

[upgrade_to_lifetime]
other = "Passer à la licence à vie"

[faq_transfer_q]
other = "Comment transférer ma licence vers un autre Mac ?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Désactivez le Mac qui utilise actuellement votre licence en allant dans Réglages > À propos et en cliquant sur le bouton « Désactiver la licence… ». Après la désactivation, vous pouvez utiliser la clé de licence sur un autre Mac.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Si vous avez perdu l'accès à la machine utilisant votre licence, contactez-nous à <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

