#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "よくある質問"

[faq_multi_q]
other = "Bezel を複数の Mac にインストールできますか？"

[faq_multi_a]
other = "はい！各個人ライセンスは 1 ユーザーで有効ですが、最大 3 台の Mac にインストールできます。デスクトップとノートパソコンをお持ちの場合や、職場と自宅で別々のマシンを使う場合に最適です。"

[faq_sub_vs_lifetime_q]
other = "サブスクリプションと買い切りの違いは何ですか？"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\"><strong>サブスクリプション</strong>（月額または年額）では、サブスクリプションが有効な限り、すべての Bezel Pro 機能にフルアクセスできます。解約した場合でも、無料トライアル版を引き続き使用できます。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\"><strong>買い切り</strong>ライセンスは一度きりの購入で、今後のすべてのアップデートを含め、アプリのライフタイムにわたってすべての Pro 機能に永続的にアクセスできます。</p>"

[faq_cancel_q]
other = "サブスクリプションを解約するとどうなりますか？"

[faq_cancel_a]
other = "サブスクリプションを解約すると、請求期間の終了まで Pro 機能へのアクセスが維持されます。その後、Bezel はウォーターマークと時間制限を含む無料トライアル版に戻ります。"

[faq_guarantee_q]
other = "30日間の返金保証とは何ですか？"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">リスクなしで購入できます！購入から 30 日以内にご不満の理由をお知らせいただければ、理由を問わず返金いたします。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">お問い合わせは <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a> まで</p>"

[faq_invoice_q]
other = "購入の請求書をもらえますか？"

[faq_invoice_a]
other = "購入が完了すると、Paddle から請求書を添付したメールが届きます。請求書に会社情報や VAT 番号が必要な場合は、チェックアウトの 2 番目のステップで左下の「Add VAT」リンクから VAT 情報を追加してください。"

[faq_manage_q]
other = "サブスクリプションはどのように管理しますか？"

[faq_manage_a]
other = "<a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">Paddle カスタマーポータル</a>から、いつでもサブスクリプションの管理、支払い方法の更新、解約ができます。Bezel 内の「設定」>「情報」からもアクセスできます。"

[faq_license_q]
other = "ライセンスはどこで確認できますか？"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">購入が完了すると、ライセンスキーを記載したメールが当社から届きます。迷惑メールフォルダも必ずご確認ください。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">ライセンスキーが見つからない場合は、<a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a> までご連絡ください。</p>"

[faq_upgrade_q]
other = "アップグレード割引はありますか？"

[faq_upgrade_a]
other = "1 年間のアップデート付きライセンスで Bezel を購入された方は、新しい Bezel プランで 50% 割引を受けられます。以前のシリアル番号を下に入力してアップグレード割引を取得してください。"

[upgrade_banner_title]
other = "以前のバージョンの Bezel からアップグレードしますか？"

[upgrade_banner_sub]
other = "以前のシリアル番号を入力して 50% 割引を受けましょう。"

[upgrade_enter_serial]
other = "シリアル番号を入力"

[upgrade_get_discount]
other = "割引を取得"

[upgrade_to_yearly]
other = "年額にアップグレード"

[upgrade_to_lifetime]
other = "買い切りにアップグレード"

[faq_transfer_q]
other = "ライセンスを別の Mac に移すにはどうすればいいですか？"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">現在ライセンスを使用している Mac で「設定」>「情報」に進み、「ライセンスの認証を解除…」ボタンをクリックして認証を解除します。認証を解除すると、別の Mac でそのライセンスキーを使用できます。</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">ライセンスを使用しているマシンにアクセスできなくなった場合は、<a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a> までご連絡ください。</p>"

