#
# ─── Pricing FAQ (pricing.html). Answers with links render with safeHTML. ───
#
[faq_title]
other = "Veelgestelde vragen"

[faq_multi_q]
other = "Kan ik Bezel op meerdere Macs installeren?"

[faq_multi_a]
other = "Ja! Elke persoonlijke licentie is geldig voor 1 gebruiker, maar kan op maximaal 3 Macs worden geïnstalleerd. Dit is perfect als je een desktop en een laptop hebt, of verschillende machines gebruikt op werk en thuis."

[faq_sub_vs_lifetime_q]
other = "Wat is het verschil tussen een abonnement en levenslang?"

[faq_sub_vs_lifetime_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Met een <strong>abonnement</strong> (maandelijks of jaarlijks) krijg je volledige toegang tot alle Bezel Pro-functies zolang je abonnement actief is. Als je opzegt, kun je nog steeds de gratis proefversie gebruiken.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">De <strong>levenslange</strong> licentie is een eenmalige aankoop die je permanente toegang geeft tot alle Pro-functies gedurende de levensduur van de app, inclusief alle toekomstige updates.</p>"

[faq_cancel_q]
other = "Wat gebeurt er als ik mijn abonnement opzeg?"

[faq_cancel_a]
other = "Als je je abonnement opzegt, behoud je toegang tot de Pro-functies tot het einde van je factuurperiode. Daarna keert Bezel terug naar de gratis proefversie, die een watermerk en tijdslimieten bevat."

[faq_guarantee_q]
other = "Wat houdt de niet-goed-geld-terug-garantie van 30 dagen in?"

[faq_guarantee_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Die zorgt voor risicovrij aankopen! Laat ons binnen 30 dagen na aankoop weten waarom je ontevreden bent, en we betalen je terug, wat de reden ook is.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Neem contact met ons op via <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a></p>"

[faq_invoice_q]
other = "Kan ik een factuur krijgen voor mijn aankoop?"

[faq_invoice_a]
other = "Na een succesvolle aankoop ontvang je een e-mail van Paddle met de factuur als bijlage. Als je je bedrijfsgegevens en/of btw-nummer op de factuur nodig hebt, voeg dan in de tweede stap tijdens het afrekenen btw-informatie toe via de link \"Add VAT\" linksonder."

[faq_manage_q]
other = "Hoe beheer ik mijn abonnement?"

[faq_manage_a]
other = "Je kunt je abonnement beheren, betaalmethoden bijwerken of op elk moment opzeggen via het <a class=\"underline\" href=\"https://customer-portal.paddle.com/cpl_01h3qnwsb8ac4b74xbkbbj631g\">Paddle-klantenportaal</a>. Je kunt dit ook openen vanuit Bezel via Instellingen > Over."

[faq_license_q]
other = "Waar vind ik mijn licentie?"

[faq_license_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Na een succesvolle aankoop ontvang je van ons een e-mail met je licentiesleutel. Controleer ook je map met ongewenste e-mail.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Kun je je licentiesleutel niet vinden? Neem dan contact met ons op via <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

[faq_upgrade_q]
other = "Is er een upgradekorting beschikbaar?"

[faq_upgrade_a]
other = "Als je Bezel hebt gekocht met een licentie met één jaar updates, kom je in aanmerking voor 50% korting op de nieuwe Bezel-abonnementen. Voer hieronder je vorige serienummer in om je upgradekorting te krijgen."

[upgrade_banner_title]
other = "Upgraden vanaf een eerdere versie van Bezel?"

[upgrade_banner_sub]
other = "Voer je vorige serienummer in voor 50% korting."

[upgrade_enter_serial]
other = "Serienummer invoeren"

[upgrade_get_discount]
other = "Korting ophalen"

[upgrade_to_yearly]
other = "Upgraden naar jaarlijks"

[upgrade_to_lifetime]
other = "Upgraden naar levenslang"

[faq_transfer_q]
other = "Hoe draag ik mijn licentie over naar een andere Mac?"

[faq_transfer_a]
other = "<p class=\"my-2 text-gray-600 dark:text-gray-400\">Deactiveer de Mac die je licentie momenteel gebruikt door naar Instellingen > Over te gaan en op de knop \"Licentie deactiveren..\" te klikken. Na het deactiveren kun je de licentiesleutel op een andere Mac gebruiken.</p>\n        <p class=\"my-2 text-gray-600 dark:text-gray-400\">Als je geen toegang meer hebt tot de machine die je licentie gebruikt, neem dan contact met ons op via <a class=\"underline\" href=\"mailto:team@nonstrict.com\">team@nonstrict.com</a>.</p>"

